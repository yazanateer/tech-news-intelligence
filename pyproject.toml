[project]
name = "israeli-tech-news-intelligence"
version = "0.1.0"
description = "AI-powered pipeline that ingests Israeli tech news, enriches it with OpenAI and delivers a WhatsApp digest."
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # macOS system Python 3.9 ships LibreSSL; harmless for this project.
    "ignore:urllib3 v2 only supports OpenSSL",
]
